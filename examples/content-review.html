<Card>
<CardHeader>
<CardTitle>What the review understood</CardTitle>

<CardContent>
Merchants can now tag products with a brand, and shoppers can filter the store by it. The filter only appears once at least one brand exists.
</CardContent>

<OpenQuestions>
- **Assumption:** Brands are created from the Products page, not from Settings.
- **Assumption:** "Brand" stays lowercase mid-sentence, like other product attributes.
</OpenQuestions>

<VariantTemplate>

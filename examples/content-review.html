<ReviewSummary whatItIs="Merchants can tag products with a brand, and shoppers can filter the store by it." audience="Every Wix Stores merchant, from a first store to an agency running dozens.">
- Brands are created from the Products page, not from Settings.
- The filter appears only once at least one brand exists.
- "Brand" stays lowercase mid-sentence, like other product attributes:
  - in the filter panel
  - in product cards
</ReviewSummary>

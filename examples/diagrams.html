# Diagrams

A fence tagged `mermaid` renders as a diagram. Mermaid itself is not in the
runtime bundle — it is fetched from a CDN the first time a page turns out to
contain one, so a document without a diagram pays nothing for this.

<ExecutiveSummary>
Diagrams are **source, not pictures**. The fence stays editable text, the
rendered SVG is vetted against the same allowlist authored SVG passes, and a
diagram that cannot load leaves its own source on the page.
</ExecutiveSummary>

## Flowchart

```mermaid
flowchart LR
  A[Source fence] --> B{Browser?}
  B -->|yes| C[Load mermaid from CDN]
  B -->|no| D[Keep the fence text]
  C --> E[Vet the SVG]
  E --> F[Draw the diagram]
```

## Sequence

```mermaid
sequenceDiagram
  participant Agent
  participant Runtime
  participant CDN
  Agent->>Runtime: a mermaid fence
  Runtime->>CDN: import mermaid@11
  CDN-->>Runtime: module
  Runtime-->>Agent: rendered SVG
  Note over Runtime,Agent: compile() never waits for this
```

## State

```mermaid
stateDiagram-v2
  [*] --> Fence
  Fence --> Loading: first diagram on the page
  Loading --> Drawn: SVG passes the allowlist
  Loading --> Fence: load or parse failed
  Drawn --> [*]
```

## A diagram cannot execute code

The graph below asks mermaid to attach a click handler. It draws, and the
handler is never bound: the runtime initializes mermaid at
`securityLevel: 'strict'`, and an `on*` attribute reaching the output would
fail the same check authored SVG fails.

```mermaid
flowchart TD
  Click[Click me] --> Nothing[Nothing happens]
  click Click callback "not bound"
```

<Callout>
**Try it:** open the console, click the node above, and confirm nothing fires.
Then edit any fence in this file's source block and reload.
</Callout>

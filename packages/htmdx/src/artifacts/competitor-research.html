## Overview

<Card class="gap-6 rounded-[28px] border-0 bg-pink-50 p-6 shadow-none">
  <CardHeader class="p-0">
    <CardTitle class="text-3xl font-semibold tracking-normal text-zinc-950">Mangomint Express Booking shows what a true pending-until-paid staff flow looks like.</CardTitle>
  </CardHeader>
<Callout>
**Direction** — When a Wix Bookings owner or staff member books for a client, the appointment should enter a **pending state** and only become confirmed after the client completes payment (or another configured commitment such as card-on-file). Staff should be able to **set a payment deadline** — how long the client has to pay before the slot is released. Staff enters minimal details (name, phone, service) and sends a completion link → client opens it on their device → pays deposit/full or adds a card → booking confirms; if the client does not pay within the deadline, the pending booking expires and the slot frees up.

**The gap** — Most tools either **confirm the slot immediately** and chase payment later, or only enforce pay-before-confirm on **client self-booking** — not owner-initiated bookings.

**The opportunity** — Combine a **minimal staff entry point** with a **client completion link**, a **configurable payment window**, visible pending status, and automatic release of unpaid slots.
</Callout>

        const competitors = [
          { id: "all", label: "All", column: null },
          { id: "mangomint", label: "Mangomint", column: 1 },
          { id: "phorest", label: "Phorest", column: 2 },
          { id: "setmore", label: "Setmore", column: 3 },
          { id: "fresha", label: "Fresha", column: 4 },
          { id: "simplybook", label: "SimplyBook.me", column: 5 },
          { id: "acuity", label: "Acuity", column: 6 },
          { id: "square", label: "Square", column: 7 }
        ];
        const params = new URLSearchParams(window.location.search);
        const requestedType = params.get("type");
        const requestedCompetitors = (params.get("competitors") || "")
          .split(",")
          .map((id) => id.trim())
          .filter(Boolean);
        const state = {
          type: types.some((type) => type.id === requestedType) ? requestedType : "all",
          competitors: requestedCompetitors.filter((id) =>
            competitors.some((competitor) => competitor.id === id && id !== "all")
          )
        };
        const anchorOffset = 112;

        function addBaseStyles() {
          if (document.getElementById("ck-artifact-base-styles")) return;
          const style = document.createElement("style");
          style.id = "ck-artifact-base-styles";
          style.textContent = `
            .ck-logo-slot {
              display: inline-flex;
              position: relative;
              width: 32px;
              height: 32px;
              overflow: hidden;
              align-items: center;
              justify-content: center;
              border: 1px solid #e4dfe8;
              border-radius: 8px;
              background: #fff;
            }
            .ck-logo-slot img {
              display: block;
              width: 100%;
              height: 100%;
              object-fit: contain;
              padding: 4px;
            }
            .ck-logo-fallback {
              display: none;
              width: 100%;
              height: 100%;
              align-items: center;
              justify-content: center;
              font-size: 12px;
              font-weight: 650;
              line-height: 1;
            }
            .ck-logo-missing img {
              display: none;
            }
            .ck-logo-missing .ck-logo-fallback {
              display: flex;
            }
            html {
              scroll-padding-top: 112px;
            }
            :where(h2, h3, section)[id] {
              scroll-margin-top: 112px;
            }
          `;
          document.head.appendChild(style);
        }

        function addStyles() {
          if (document.getElementById("ck-matrix-filter-styles")) return;
          const style = document.createElement("style");
          style.id = "ck-matrix-filter-styles";
          style.textContent = `
            .ck-matrix-filters {
              display: grid;
              gap: 12px;
              margin: 0 0 12px;
              padding: 16px 0 2px;
            }
            .ck-matrix-filter-row {
              display: grid;
              grid-template-columns: 92px minmax(0, 1fr);
              gap: 12px;
              align-items: start;
            }
            .ck-matrix-filter-label {
              padding-top: 8px;
              color: #6f6b79;
              font-size: 13px;
              font-weight: 600;
              line-height: 1.2;
            }
            .ck-matrix-chip-group {
              display: flex;
              flex-wrap: wrap;
              gap: 8px;
            }
            .ck-matrix-competitor-chips {
              flex-wrap: nowrap;
              overflow-x: auto;
              padding-bottom: 2px;
            }
            .ck-matrix-chip {
              min-height: 34px;
              border: 1px solid #e4dfe8;
              border-radius: 999px;
              background: #fff;
              color: #302c38;
              padding: 0 14px;
              font: inherit;
              font-size: 14px;
              font-weight: 600;
              cursor: pointer;
              white-space: nowrap;
            }
            .ck-matrix-chip:hover {
              border-color: #d8d1dd;
              background: #fcf8fd;
            }
            .ck-matrix-chip.is-active {
              border-color: #b02ab8;
              background: #b02ab8;
              color: #fff;
            }
            .ck-matrix-hidden {
              display: none !important;
            }
            @media (max-width: 760px) {
              .ck-matrix-filter-row {
                grid-template-columns: 1fr;
                gap: 6px;
              }
            }
          `;
          document.head.appendChild(style);
        }

        function prepareExternalLinks() {
          document.querySelectorAll('a[href^="http"]').forEach((link) => {
            link.target = "_blank";
            link.rel = "noreferrer";
          });
        }

        function prepareLogoFallbacks() {
          document.querySelectorAll("[data-ck-logo]").forEach((image) => {
            const slot = image.closest(".ck-logo-slot");
            if (!slot) return;
            const markMissing = () => slot.classList.add("ck-logo-missing");
            image.addEventListener("error", markMissing, { once: true });
            if (image.complete && image.naturalWidth === 0) markMissing();
          });
        }

        function alignHashTarget() {
          if (!window.location.hash) return;
          const id = decodeURIComponent(window.location.hash.slice(1));
          const target = document.getElementById(id);
          if (!target) return;
          requestAnimationFrame(() => {
            const top = target.getBoundingClientRect().top + window.scrollY - anchorOffset;
            window.scrollTo({ top, behavior: "auto" });
          });
        }

        function makeChip(item, group, render) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "ck-matrix-chip";
          button.dataset.group = group;
          button.dataset.id = item.id;
          button.textContent = item.label;
          button.addEventListener("click", () => {
            if (group === "type") {
              state.type = item.id;
            } else if (item.id === "all") {
              state.competitors = [];
            } else if (state.competitors.includes(item.id)) {
              state.competitors = state.competitors.filter((id) => id !== item.id);
            } else {
              state.competitors = [...state.competitors, item.id];
            }
            render();
          });
          return button;
        }

        function initMatrixFilters() {
          const scroll = document.querySelector(".ck-matrix-scroll");
          if (!scroll || scroll.dataset.filtersReady === "true") return false;
          const table = scroll.firstElementChild;
          if (!table) return false;
          const grids = Array.from(table.children).filter((child) =>
            child.className && String(child.className).includes("grid")
          );
          if (grids.length < 2) return false;

          addStyles();
          scroll.dataset.filtersReady = "true";

          const filterShell = document.createElement("div");
          filterShell.className = "ck-matrix-filters";
          filterShell.innerHTML = `
            <div class="ck-matrix-filter-row">
              <div class="ck-matrix-filter-label">Signal</div>
              <div class="ck-matrix-chip-group" data-filter-group="type"></div>
            </div>
            <div class="ck-matrix-filter-row">
              <div class="ck-matrix-filter-label">Competitor</div>
              <div class="ck-matrix-chip-group ck-matrix-competitor-chips" data-filter-group="competitor"></div>
            </div>
          `;

          const meta = scroll.previousElementSibling;
          scroll.parentElement.insertBefore(filterShell, meta || scroll);

          const typeRoot = filterShell.querySelector('[data-filter-group="type"]');
          const competitorRoot = filterShell.querySelector('[data-filter-group="competitor"]');
          const header = grids[0];
          const dataRows = grids.slice(1);
          const originalMeta = meta ? meta.textContent : "";

          const render = () => {
            typeRoot.querySelectorAll(".ck-matrix-chip").forEach((chip) => {
              chip.classList.toggle("is-active", chip.dataset.id === state.type);
            });
            competitorRoot.querySelectorAll(".ck-matrix-chip").forEach((chip) => {
              const active = chip.dataset.id === "all"
                ? state.competitors.length === 0
                : state.competitors.includes(chip.dataset.id);
              chip.classList.toggle("is-active", active);
            });

            const activeType = types.find((type) => type.id === state.type) || types[0];
            const activeRows = activeType.rows || dataRows.map((_, index) => index);
            const activeCompetitors = state.competitors.length === 0
              ? competitors.filter((competitor) => competitor.id !== "all")
              : competitors.filter((competitor) => state.competitors.includes(competitor.id));
            const activeColumns = activeCompetitors.map((competitor) => competitor.column);
            const columnTemplate = activeColumns.length === 1
              ? "240px minmax(0, 1fr)"
              : `240px repeat(${activeColumns.length}, 160px)`;
            const minWidth = activeColumns.length === 1
              ? "100%"
              : `${240 + activeColumns.length * 160}px`;

            table.style.minWidth = minWidth;
            [header, ...dataRows].forEach((grid) => {
              const cells = Array.from(grid.children);
              grid.style.gridTemplateColumns = columnTemplate;
              cells.forEach((cell, index) => {
                const visible = index === 0 || activeColumns.includes(index);
                cell.classList.toggle("ck-matrix-hidden", !visible);
              });
            });

            dataRows.forEach((row, index) => {
              row.classList.toggle("ck-matrix-hidden", !activeRows.includes(index));
            });

            if (meta) {
              meta.textContent = `${activeRows.length} capabilities x ${activeColumns.length} competitors. ${activeColumns.length === 1 ? "All selected competitors visible." : "Scroll sideways for the remaining competitor detail."}`;
            }
            scroll.scrollLeft = 0;
          };

          typeRoot.replaceChildren(...types.map((item) => makeChip(item, "type", render)));
          competitorRoot.replaceChildren(...competitors.map((item) => makeChip(item, "competitor", render)));
          if (meta && originalMeta) meta.textContent = originalMeta;
          render();
          return true;
        }

        addBaseStyles();

        const observer = new MutationObserver(() => {
          prepareExternalLinks();
          prepareLogoFallbacks();
          if (initMatrixFilters()) observer.disconnect();
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener("load", () => {
          prepareExternalLinks();
          prepareLogoFallbacks();
          initMatrixFilters();
          alignHashTarget();
        });
        window.addEventListener("hashchange", alignHashTarget);
        setTimeout(() => {
          prepareExternalLinks();
          prepareLogoFallbacks();
          initMatrixFilters();
          alignHashTarget();
        }, 300);
      })();
    </script>
  </body>
</html>

## Code

Inline spans mark identifiers such as `compile()` or the `--htmdx-mono` token.
A fence carries a whole snippet: its info string names the language, which
drives the label, the `language-ts` class, and the highlighting.

```ts
import { compile } from '@wix/htmdx';

// Highlighting is a built-in tokenizer: no WASM, no async setup, no CDN.
const rendered = compile('# Title\n\nBody with `code`.');
if (rendered.ok) {
  document.body.innerHTML = rendered.html;
}
```

Component tags and HTML stay literal inside a fence:

```html
<Callout title="not a component here">Just text.</Callout>
```

```bash
yarn workspace @wix/htmdx build:library --watch # rebuilds browser.js
```

```diff
-  <pre><code>plain</code></pre>
+  <figure class="htmdx-code-figure">…</figure>
```

An author-written `<pre>` gets the same treatment, and a `language-*` class on
its `<code>` picks the grammar:

<pre><code class="language-json">{ "theme": "creator", "layout": "doc" }</code></pre>

file and no component. Confidence <svg viewBox="0 0 24 24" width="14" height="14" class="inline align-text-bottom"><circle cx="12" cy="12" r="10" fill="#16a34a"></circle></svg> high.

A graphic can move on its own. `animateTransform` rotates, and `animateMotion`
follows a path — both declarative, neither needing script.
